<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASSAN ADMIN</title>
<style>
body {
  background:#0b0d10;
  color:#eee;
  font-family:Arial;
  text-align:center;
  padding:30px 15px;
}
input,button {
  display:block;
  width:100%;
  max-width:350px;
  padding:14px;
  margin:12px auto;
  box-sizing:border-box;
  border-radius:8px;
}
input {
  background:#171b22;
  color:white;
  border:1px solid #333;
}
button {
  background:#1769df;
  color:white;
  border:0;
  font-size:17px;
}
#close {
  background:#b32626;
}
#msg {
  margin:20px;
  color:#7fd0a0;
}
</style>
</head>
<body>

<h2>HASSAN ADMIN</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button id="login">تسجيل الدخول</button>

<div id="panel" hidden>
<button id="open">فتح الموقع</button>
<button id="close">قفل الموقع</button>
<button id="logout">تسجيل خروج</button>
</div>

<p id="msg"></p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDvezJVLE2Eqx1Fpb-Au3t54nJzJE166wo",
  authDomain: "github-6db28.firebaseapp.com",
  databaseURL: "https://github-6db28-default-rtdb.firebaseio.com/",
  projectId: "github-6db28",
  storageBucket: "github-6db28.firebasestorage.app",
  messagingSenderId: "832512680809",
  appId: "1:832512680809:web:58968c28630dda968853f8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
const msg = $("msg");

$("login").onclick = async () => {
  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    msg.textContent = "تم تسجيل الدخول";
  } catch(e) {
    msg.textContent = "خطأ: " + e.message;
  }
};

auth.onAuthStateChanged(user => {
  $("panel").hidden = !user;
  $("login").hidden = !!user;
  $("email").hidden = !!user;
  $("password").hidden = !!user;
});

async function control(value) {
  try {
    await db.ref("siteControl/enabled").set(value);
    msg.textContent = value
      ? "تم فتح الموقع للجميع"
      : "تم قفل الموقع للجميع";
  } catch(e) {
    msg.textContent = "خطأ: " + e.message;
  }
}

$("open").onclick = () => control(true);
$("close").onclick = () => control(false);
$("logout").onclick = () => auth.signOut();
</script>

</body>
</html>
